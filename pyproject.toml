[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kalpa-crs"
version = "2.0.1"
description = "Autonomous Causal Cyber Reasoning System (CRS)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "hazlived", email = "hazlived@users.noreply.github.com" }
]
keywords = ["security", "fuzzing", "cyber-reasoning", "autofix"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3"
]
requires-python = ">=3.9"
dependencies = [
    "sqlalchemy>=2.0.0",
    "pytest>=7.0.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.20.0",
    "pydantic>=1.10.0"
]

[project.urls]
Homepage = "https://github.com/hazlived/kalpa"
Repository = "https://github.com/hazlived/kalpa.git"
Issues = "https://github.com/hazlived/kalpa/issues"
Changelog = "https://github.com/hazlived/kalpa/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["kalpa*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
